worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'tenant_id=$http_x_tenant_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Lua package path for custom scripts
    lua_package_path "/etc/nginx/lua/?.lua;;";
    
    # Shared dictionary for rate limiting per tenant
    lua_shared_dict tenant_rate_limit 20m;
    
    # Upstream services
    upstream device_registry {
        server device-registry-service.default.svc.cluster.local:8080;
        keepalive 32;
    }
    
    upstream tenant_catalog {
        server tenant-catalog-service.default.svc.cluster.local:8080;
        keepalive 32;
    }
    
    upstream backend_service {
        server localhost:8081;  # Placeholder - will be configured per deployment
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main API endpoint with tenant routing
        location /api {
            # Extract device ID and inject tenant ID
            access_by_lua_file /etc/nginx/lua/tenant_router.lua;
            
            # Apply tenant-level rate limiting
            access_by_lua_file /etc/nginx/lua/rate_limiter.lua;
            
            # Proxy to backend service
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Id $tenant_id;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Direct access to Device Registry (for testing/admin)
        location /admin/devices {
            proxy_pass http://device_registry/api/devices;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Direct access to Tenant Catalog (for testing/admin)
        location /admin/tenants {
            proxy_pass http://tenant_catalog/api/tenants;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
