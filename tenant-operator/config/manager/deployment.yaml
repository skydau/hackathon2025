apiVersion: v1
kind: Namespace
metadata:
  name: tenant-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-operator
  namespace: tenant-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-operator-role
subjects:
- kind: ServiceAccount
  name: tenant-operator
  namespace: tenant-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-operator
  namespace: tenant-operator-system
  labels:
    app: tenant-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-operator
  template:
    metadata:
      labels:
        app: tenant-operator
    spec:
      serviceAccountName: tenant-operator
      containers:
      - name: manager
        image: tenant-operator:latest
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        - --leader-elect
        env:
        # SQL Server连接配置（用于数据库自动创建）
        - name: SQL_SERVER_HOST
          valueFrom:
            secretKeyRef:
              name: sqlserver-admin-secret
              key: server
              optional: true
        - name: SQL_SERVER_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: sqlserver-admin-secret
              key: username
              optional: true
        - name: SQL_SERVER_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sqlserver-admin-secret
              key: password
              optional: true
        # Tenant Catalog Service URL（用于注册数据库配置）
        - name: TENANT_CATALOG_URL
          value: "http://tenant-catalog.platform-system.svc.cluster.local:8080"
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
