apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.tenants.medlogic.io
spec:
  group: tenants.medlogic.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Tenant is the Schema for the tenants API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.'
            type: string
          metadata:
            type: object
          spec:
            description: TenantSpec defines the desired state of Tenant
            properties:
              db:
                description: DB contains database configuration for the tenant
                properties:
                  database:
                    description: Database is the database name
                    type: string
                  mode:
                    description: Mode is either "perDatabase" or "perSchema"
                    type: string
                  schema:
                    description: Schema is the schema name (for perSchema mode)
                    type: string
                  server:
                    description: Server is the database server address
                    type: string
                required:
                - database
                - mode
                - server
                type: object
              displayName:
                description: DisplayName is the human-readable name of the tenant
                type: string
              slo:
                description: SLO contains service level objective configuration
                properties:
                  availability:
                    description: Availability target (e.g., "99.9%")
                    type: string
                  p95_latency_ms:
                    description: P95LatencyMs is the p95 latency target in milliseconds
                    type: integer
                type: object
              throttling:
                description: Throttling contains rate limiting configuration
                properties:
                  rps:
                    description: RPS is requests per second limit
                    type: integer
                type: object
            required:
            - db
            - displayName
            type: object
          status:
            description: TenantStatus defines the observed state of Tenant
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the tenant's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating
                        details about the transition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation
                        that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating
                        the reason for the condition's last transition.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              namespaceCreated:
                description: NamespaceCreated indicates if the namespace has been
                  created
                type: boolean
              phase:
                description: Phase represents the current phase of tenant provisioning
                type: string
              resourcesProvisioned:
                description: ResourcesProvisioned indicates if all resources have
                  been provisioned
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
