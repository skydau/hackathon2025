apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireTenantLabel
metadata:
  name: require-tenant-label
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "tenant-*"
  parameters:
    message: "All workloads in tenant namespaces must have a 'tenantId' label"
