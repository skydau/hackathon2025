apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiretenantlabel
  annotations:
    description: "Requires all workloads in tenant namespaces to have a tenantId label"
spec:
  crd:
    spec:
      names:
        kind: K8sRequireTenantLabel
      validation:
        # Schema for the parameters field
        openAPIV3Schema:
          type: object
          properties:
            message:
              type: string
              description: "Custom error message to display when validation fails"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiretenantlabel

        violation[{"msg": msg}] {
          # Check if this is a tenant namespace (starts with "tenant-")
          startswith(input.review.object.metadata.namespace, "tenant-")
          
          # Check if this is a workload resource
          is_workload(input.review.object.kind)
          
          # Check if tenantId label is missing
          not input.review.object.metadata.labels.tenantId
          
          msg := sprintf("Workload %v/%v in tenant namespace must have a 'tenantId' label", [input.review.object.kind, input.review.object.metadata.name])
        }

        violation[{"msg": msg}] {
          # Check if this is a tenant namespace (starts with "tenant-")
          startswith(input.review.object.metadata.namespace, "tenant-")
          
          # Check if this is a workload resource
          is_workload(input.review.object.kind)
          
          # Check if tenantId label is empty
          input.review.object.metadata.labels.tenantId == ""
          
          msg := sprintf("Workload %v/%v in tenant namespace has an empty 'tenantId' label", [input.review.object.kind, input.review.object.metadata.name])
        }

        is_workload(kind) {
          workload_kinds := ["Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob", "Pod", "ReplicaSet"]
          workload_kinds[_] == kind
        }
