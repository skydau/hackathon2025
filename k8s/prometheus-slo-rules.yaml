apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-slo-rules
  namespace: observability
data:
  slo-rules.yml: |
    groups:
      - name: tenant_slo_alerts
        interval: 30s
        rules:
          # Error rate SLO alert
          - alert: TenantErrorRateExceeded
            expr: |
              (
                sum(rate(http_requests_total{status=~"5.."}[5m])) by (tenant_id)
                /
                sum(rate(http_requests_total[5m])) by (tenant_id)
              ) * 100 > 5
            for: 5m
            labels:
              severity: warning
              slo_type: error_rate
            annotations:
              summary: "Tenant {{ $labels.tenant_id }} error rate exceeded SLO"
              description: "Tenant {{ $labels.tenant_id }} has error rate of {{ $value | humanizePercentage }} which exceeds the 5% threshold for 5 minutes."
              tenant_id: "{{ $labels.tenant_id }}"
              violation_details: "Error rate: {{ $value | humanizePercentage }}, Threshold: 5%"

          # P95 latency SLO alert
          - alert: TenantP95LatencyExceeded
            expr: |
              histogram_quantile(0.95, 
                sum(rate(http_request_duration_seconds_bucket[5m])) by (tenant_id, le)
              ) * 1000 > on(tenant_id) group_left
              tenant_slo_p95_latency_ms
            for: 5m
            labels:
              severity: warning
              slo_type: latency
            annotations:
              summary: "Tenant {{ $labels.tenant_id }} P95 latency exceeded SLO"
              description: "Tenant {{ $labels.tenant_id }} has P95 latency of {{ $value | humanize }}ms which exceeds the configured SLO threshold for 5 minutes."
              tenant_id: "{{ $labels.tenant_id }}"
              violation_details: "P95 latency: {{ $value | humanize }}ms"

          # SLO achievement rate calculation
          - record: tenant_slo_achievement_rate
            expr: |
              (
                (
                  (
                    sum(rate(http_requests_total{status!~"5.."}[5m])) by (tenant_id)
                    /
                    sum(rate(http_requests_total[5m])) by (tenant_id)
                  ) >= 0.95
                )
                and
                (
                  histogram_quantile(0.95, 
                    sum(rate(http_request_duration_seconds_bucket[5m])) by (tenant_id, le)
                  ) * 1000 <= on(tenant_id) group_left
                  tenant_slo_p95_latency_ms
                )
              )

          # Tenant SLO configuration (to be populated from Tenant Catalog)
          - record: tenant_slo_p95_latency_ms
            expr: |
              label_replace(
                tenant_slo_config{slo_type="p95_latency_ms"},
                "tenant_id", "$1", "tenant_id", "(.*)"
              )

          - record: tenant_slo_availability_target
            expr: |
              label_replace(
                tenant_slo_config{slo_type="availability"},
                "tenant_id", "$1", "tenant_id", "(.*)"
              )
