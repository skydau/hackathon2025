# RBAC配置 - 允许TenantCatalogService创建和管理Tenant CRDs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-catalog
  namespace: platform-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-catalog-role
rules:
- apiGroups: ["tenants.medlogic.io"]
  resources: ["tenants"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-catalog-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-catalog-role
subjects:
- kind: ServiceAccount
  name: tenant-catalog
  namespace: platform-system