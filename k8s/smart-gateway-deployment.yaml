apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: gateway
data:
  nginx.conf: |
    # Configuration is baked into the Docker image
    # This ConfigMap can be used for runtime overrides if needed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-gateway
  namespace: gateway
  labels:
    app: smart-gateway
    component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-gateway
  template:
    metadata:
      labels:
        app: smart-gateway
        component: gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - smart-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: nginx
        image: smart-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: DEVICE_REGISTRY_URL
          value: "http://device-registry-service.default.svc.cluster.local:8080"
        - name: TENANT_CATALOG_URL
          value: "http://tenant-catalog-service.default.svc.cluster.local:8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: smart-gateway
  namespace: gateway
  labels:
    app: smart-gateway
spec:
  type: LoadBalancer
  selector:
    app: smart-gateway
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: smart-gateway-internal
  namespace: gateway
  labels:
    app: smart-gateway
spec:
  type: ClusterIP
  selector:
    app: smart-gateway
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
