apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-registry-service
  namespace: platform-system
  labels:
    app: device-registry-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: device-registry-service
  template:
    metadata:
      labels:
        app: device-registry-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: device-registry-sa
      containers:
      - name: device-registry-service
        image: medlogic/device-registry-service:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: https
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: AZURE_CLIENT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['azure.workload.identity/client-id']
        - name: AZURE_TENANT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['azure.workload.identity/tenant-id']
        - name: AZURE_FEDERATED_TOKEN_FILE
          value: "/var/run/secrets/azure/tokens/azure-identity-token"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: device-registry
  namespace: platform-system
spec:
  selector:
    app: device-registry-service
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
