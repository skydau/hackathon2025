apiVersion: v1
kind: Service
metadata:
  name: medlogic-service
  namespace: medlogic
  labels:
    app: medlogic-service
spec:
  selector:
    app: medlogic-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medlogic-service
  namespace: medlogic
  labels:
    app: medlogic-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medlogic-service
  template:
    metadata:
      labels:
        app: medlogic-service
    spec:
      containers:
      - name: medlogic-service
        image: medlogic/medlogic-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: TenantCatalog__BaseUrl
          value: "http://tenant-catalog-service.medlogic.svc.cluster.local:8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
